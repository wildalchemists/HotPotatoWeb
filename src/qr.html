<!doctype html>
<html lang="{{= lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{t qr.title}}</title>
<meta name="description" content="{{t qr.description}}">
<meta name="robots" content="noindex">
<link rel="canonical" href="{{= url}}">
<link rel="alternate" hreflang="en" href="{{= siteUrl}}qr/">
<link rel="alternate" hreflang="es" href="{{= siteUrl}}es/qr/">
<meta name="theme-color" content="#3BABD2">
<link rel="icon" href="{{= base}}favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@900&family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{= base}}links.css?v={{= v}}">
</head>
<body class="qr-page">
<a class="skip" href="#codes">{{t ui.skipToContent}}</a>
<main class="yard wide">
  <header class="qr-head">
    <span class="plate plate-static" aria-hidden="true">{{= qr.code}}</span>
    <div class="qr-brand"><img src="{{= base}}assets/img/logo-600.webp" width="1200" height="1166" alt="{{= meta.officialName}}"><h1 class="display" data-k="qr.heading">{{t qr.heading}}</h1></div>
    <p class="lead" data-k="qr.lead">{{t qr.lead}}</p>
    <p class="noprint"><a class="mono dl" href="#" onclick="window.print();return false" data-k="qr.print">{{t qr.print}}</a> &nbsp;·&nbsp; <a class="mono dl" href="{{= base}}{{#if lang == es}}es/{{/if}}screen/" data-k="screen.title">{{t screen.title}}</a></p>
  </header>

  <ul class="codes" id="codes" data-list="qr.items">
    {{#each qr.items as q}}
    <li class="code code-{{= q.id}}">
      <h2 class="display" data-k="{{= q_path}}.label">{{t q.label}}</h2>
      <a class="code-img" href="{{= q.href}}" rel="noopener" data-href="{{= q_path}}.href">
        <img src="{{= base}}assets/img/{{= q.file}}.svg" width="520" height="520" alt="{{t qr.qrAlt}} {{= q.href}}">
      </a>
      <p class="mono url">{{= q.href}}</p>
      <a class="mono dl noprint" href="{{= base}}assets/img/{{= q.file}}-1024.png" download="hot-potato-{{= q.id}}-qr.png" data-k="qr.download">{{t qr.download}}</a>
    </li>
    {{/each}}
  </ul>

  <footer class="strip">
    <span class="mono"><span data-k="meta.shortName">{{= meta.shortName}}</span> · <span data-k="team.studioName">{{= team.studioName}}</span></span>
    <a class="mono noprint" href="{{= otherUrl}}" hreflang="{{= otherLang}}" lang="{{= otherLang}}" data-lang-switch="{{= otherLang}}">{{t ui.languageSwitch}}</a>
  </footer>
</main>
</body>
</html>
